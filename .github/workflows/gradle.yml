name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'
      
      # --- ДОБАВЛЯЕМ ШАГИ ДЛЯ УСТАНОВКИ CHROME И ЗАВИСИМОСТЕЙ (если их нет) ---
      # Если ты это уже добавлял, убедись, что они есть в файле
      - name: Install Google Chrome and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          sudo apt-get install -y libnss3-dev libgconf-2-4 libfontconfig1 libxkbcommon-x11-0 libgbm-dev
          # Для работы headless Chrome может потребоваться xvfb
          sudo apt-get install -y xvfb

      - name: Verify Chrome installation
        run: google-chrome --version
          # --------------------------------------------------------

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start SUT
        # Убедись, что имя файла здесь app-ibank.jar, а не app-mbank.jar
        run: java -jar ./artifacts/app-ibank.jar -P:profile=test &

      - name: Wait for SUT to start
        run: sleep 15s # Ждем 15 секунд, этого должно быть достаточно

      - name: Build with Gradle and Run Tests
        # Обязательно указываем headless режим для Selenide в CI
        # Убедитесь, что пути к Chrome драйверу корректны, если Selenide не находит его автоматически
        run: ./gradlew test -Dselenide.headless=true -Dselenide.browser=chrome -Dwebdriver.chrome.driver=/usr/bin/google-chrome